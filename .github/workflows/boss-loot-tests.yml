name: Boss Loot browser checks
on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.json
      - app-install.js
      - wallet-feedback.js
      - wallet-feedback.css
      - reveal.js
      - reveal.css
      - motion.css
      - progression.js
      - progression.css
      - economy.js
      - economy.css
      - sw.js
      - offline.html
      - icons/**
      - package.json
      - playwright.config.js
      - tests/**
      - .github/workflows/boss-loot-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate frontend syntax
        run: node --input-type=module -e "import fs from 'node:fs'; import vm from 'node:vm'; const html=fs.readFileSync('index.html','utf8');new vm.Script(html.split('<script>')[1].split('</script>')[0]);"
      - name: Test responsive Boss Loot storefront
        run: npm run test:e2e
      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boss-loot-test-results
          path: test-results/
          if-no-files-found: ignore