name: Desktop Reveal Layout Playwright

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'reveal.css'
      - 'tests/reveal.spec.js'
      - '.github/workflows/desktop-reveal-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-reveal-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify all desktop cards fit
        run: npx playwright test tests/reveal.spec.js --grep "desktop five-card hand"
